name: Database Policy Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local database
        run: supabase db start

      - name: Run RLS and privacy pgTAP tests
        run: supabase test db

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
