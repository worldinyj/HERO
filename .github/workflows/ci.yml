name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm validate:scenario
      - run: pnpm test
      - run: pnpm build

      - name: Check invitation and start-session Edge Functions
        run: |
          deno check --config supabase/functions/deno.json supabase/functions/create-invite/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/peek-invite/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/accept-invite/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/start-session/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/deactivate-user/index.ts

      - name: Check submit-session shared engine graph
        run: deno check --config supabase/functions/submit-session/deno.json supabase/functions/submit-session/index.ts
