name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm validate:scenario
      - name: Validate scenario drafts
        run: pnpm validate:scenario scenarios/drafts
      - name: Check scenario promotion gate
        run: pnpm check:scenario-promotion
      - name: Simulate research drafts
        run: |
          for scenario in scenarios/drafts/*.json; do
            echo "=== $scenario ==="
            pnpm simulate:scenario -- --scenario="$scenario"
          done
      - name: Run scenario path simulation
        run: pnpm simulate:scenario
      - name: Analyze HP balance and farming guards
        run: pnpm analyze:hp-balance
      - run: pnpm test
      - run: pnpm build

      - name: Verify Kakao share SDK contract
        run: |
          grep -q 'KAKAO_SDK_VERSION = "2.8.2"' apps/web/src/lib/kakaoShare.ts
          grep -q 'sha384-zt/G7/KfaRQ9dT/QIkS0ujMtzouJqzuSJcXVQu50x0rl/+mD1dc70AeOejVbMD9E' apps/web/src/lib/kakaoShare.ts
          grep -q 'VITE_KAKAO_JS_KEY=' apps/web/.env.example

      - name: Check client secret leakage
        run: |
          node scripts/check-client-secrets.mjs
          tracked_env="$(git ls-files | grep -E '(^|/)\.env([.]|$)' | grep -v -E '\.env\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "$tracked_env"
            echo "Tracked runtime .env file detected"
            exit 1
          fi


      - name: Verify route code splitting
        run: node scripts/check-route-splitting.mjs

      - name: Verify PWA shell
        run: |
          test -f apps/web/dist/manifest.webmanifest
          test -f apps/web/dist/sw.js
          test -f apps/web/dist/offline.html
          test -f apps/web/dist/pwa-icon.svg
          grep -q 'rel="manifest"' apps/web/dist/index.html
          grep -q 'registerHeroServiceWorker' apps/web/src/main.tsx
          node --check apps/web/public/sw.js
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('apps/web/dist/manifest.webmanifest','utf8')); if(m.name!=='HERO — Human Error Risk Operations'||m.display!=='standalone'||m.start_url!=='/'||!Array.isArray(m.icons)||m.icons.length===0) process.exit(1)"

      - name: Check invitation and start-session Edge Functions
        run: |
          deno check --config supabase/functions/deno.json supabase/functions/create-invite/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/peek-invite/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/accept-invite/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/start-session/index.ts

      - name: Check submit-session shared engine graph
        run: deno check --config supabase/functions/submit-session/deno.json supabase/functions/submit-session/index.ts

      - name: Check admin scenario Edge Function
        run: deno check --config supabase/functions/admin-scenario/deno.json supabase/functions/admin-scenario/index.ts

      - name: Check manager user action Edge Function
        run: deno check --config supabase/functions/deno.json supabase/functions/manager-user-action/index.ts

      - name: Check nickname policy Edge Function
        run: deno check --config supabase/functions/deno.json supabase/functions/nickname-action/index.ts

      - name: Enforce shared audit writer
        run: |
          if grep -R -n --include='*.ts' 'from("audit_logs").insert' supabase/functions --exclude='audit.ts'; then
            echo "Direct audit_logs insert found outside _shared/audit.ts"
            exit 1
          fi
