<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1624" />
    <title>HERO · 오프라인</title>
    <style>
      :root {
        font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif;
        color: #e8ecf4;
        background: #0e1624;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 10%, rgba(111,160,255,.12), transparent 36%),
          #0e1624;
      }
      main {
        width: min(100%, 440px);
        padding: 24px;
        border: 1px solid rgba(138,150,173,.24);
        border-radius: 18px;
        background: #16213a;
      }
      .eyebrow {
        margin: 0 0 8px;
        color: #f2a541;
        font-size: .78rem;
        font-weight: 800;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      h1 { margin: 0 0 12px; font-size: 1.4rem; }
      p { color: #aab4c6; line-height: 1.65; }
      .note {
        padding: 12px;
        border-radius: 12px;
        background: rgba(111,160,255,.08);
      }
      button {
        min-height: 48px;
        width: 100%;
        margin-top: 8px;
        border: 0;
        border-radius: 12px;
        color: #0e1624;
        background: #f2a541;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">HERO Offline</p>
      <h1>현재 네트워크에 연결되어 있지 않습니다</h1>
      <p>
        새 세션 시작과 서버 제출에는 인터넷 연결이 필요합니다.
        이미 시작해 기기에 저장된 플레이는 앱 화면이 캐시되어 있다면 계속 진행할 수 있습니다.
      </p>
      <p class="note">
        연결이 복구되면 저장된 진행상태로 돌아갈 수 있습니다. 제출 대기 중인 경쟁 세션 결과는 같은 사용자로 로그인되어 있으면 자동으로 다시 전송됩니다.
      </p>
      <button type="button" onclick="location.reload()">다시 연결 확인</button>
    </main>
  </body>
</html>
